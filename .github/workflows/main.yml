image: alpine

#####################################
# gitlab-ci.yml for Ex0 - GIT & VS  #
#####################################

stages:
  - perparation
  - VSFilesCheck
  - ExcludedFilesCheck

Build test tools:
  stage: perparation
  before_script:
    - apk update
    - apk add git
    - apk add go
    - apk add build-base gcc abuild binutils
    
  script:

    # build utils
    - git clone https://gitlab.com/exercisetests/utils.git
    - cd utils
    - g++ clearscreen.cpp -o clearscreen
    - g++ printbanner.cpp -o printbanner
    - g++ printMessage.cpp -o printMessage
    
    - mv clearscreen ..
    - mv printbanner ..
    - mv printMessage ..
    - mv CodesToMessages.csv ..
    - cd ..

    # build files verifier
    - git clone https://gitlab.com/exercisetests/verifysubmittedfiles.git
    - cd verifysubmittedfiles
    - go build .
    - mv filesverifier ..
    - cd ..

   # build exercise files tests
    - git clone https://gitlab.com/magshimim2022ekronotex0/ex0files.git
    - cd ex0files
    - mv PreSubmissionChecker.txt ..
    - cd ..

  artifacts:
    paths:
      - filesverifier
      - clearscreen
      - printMessage
      - CodesToMessages.csv
      - printbanner
      - PreSubmissionChecker.txt

Verify Visual Studio Files:
  stage: VSFilesCheck
  needs:
    - job: Build test tools
  before_script:
  - apk add git
  - apk add build-base gcc abuild binutils
  script:
    - ./clearscreen 50
    - ./printbanner
    - echo "Verifying required VS files..."
    - ./filesverifier PreSubmissionChecker.txt 2
    - echo "Required VS files ok"

Verify Excluded Files:
  stage: ExcludedFilesCheck
  needs:
    - job: Build test tools
    - job: Verify Visual Studio Files
  before_script:
  - apk add git
  - apk add build-base gcc abuild binutils
  script:
    - ./clearscreen 50
    - ./printbanner
    - echo "Verifying files that should not be submitted..."
    - ./filesverifier PreSubmissionChecker.txt 4
    - echo "Excluded files ok"